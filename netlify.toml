# Netlify settings for KICKOFF

[build]
  command = "npm run build"
  publish = "dist"

# Any unknown address (e.g. /join/abc) opens the app instead of a 404 page.
# Real files like /rotation.html and /og-image.png are still served as-is.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
